name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv sync --frozen --python 3.12 --group build
      - name: The tag names this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(uv run --frozen python -c 'import rwg2migrator; print(rwg2migrator.__version__)')"
      - name: Lint and test
        if: runner.os == 'Linux'
        run: |
          uv run --frozen playwright install --with-deps chromium
          uv run --frozen ruff check
          uv run --frozen pytest -q
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: |
          uv run --frozen playwright install chromium
          uv run --frozen pytest -q
      - run: uv run --frozen python dev/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - name: Draft release with the zips, SHA256SUMS and the link to this version's source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft
          --title "rwg2-migrator $GITHUB_REF_NAME"
          --notes "Source of exactly this version (GPL-3.0): https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME.
          Check your download against SHA256SUMS."
