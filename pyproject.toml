[project]
name = "rwg2-migrator"
version = "0.1.0"
description = "Migrate a GTNH legacy-RWG world to RWG2 Smooth while keeping a chosen area byte-identical."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.1", "Pillow>=11", "psutil>=6"]

[project.scripts]
rwg2-migrator = "rwg2migrator.cli:main"

[dependency-groups]
dev = [
    "imageio-ffmpeg==0.6.0",
    "playwright>=1.64.1",
    "pytest>=8",
    "ruff==0.17.3",
]
build = ["pyinstaller>=6.11"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rwg2migrator"
module-root = ""

[tool.ruff]
line-length = 140
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C901", "PLR0913", "PLR0917", "PLR2004", "PLR1702"]
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 4
max-nested-blocks = 3

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "e2e_*.py"]
markers = ["fixture: needs RWG2_FIXTURE pointing at a copy of the pre-RWG2 server tree"]
